[project]
name = "sdlc-automation-examples"
version = "0.1.0"
description = "SDLC Python automation examples: release notes, chat-triggered issue creation, repo command standards"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
